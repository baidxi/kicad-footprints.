# All the CI config is in the library-utils repo
#
# The goal is to have only one place where all the CI
# related things are.
include:
  - remote: 'https://gitlab.com/kicad/libraries/kicad-library-utils/-/raw/master/tools/gitlabci/gitlab-ci-footprints.yml'
model:
  script:
    - echo "Searching for script..."
    - find . -name create_model_board.py
    - find . -name create_model_board.py -exec sed -i 's/fp.Duplicate()/fp.Duplicate(False)/g' {} +
    - $KICAD_LIBRARY_UTILS_DIR/tools/gitlabci/screenshot_model.sh