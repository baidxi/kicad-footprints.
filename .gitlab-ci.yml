image: python:latest

stages:
  - test
  - diffs
  - screenshot
  - model

variables:
  KICAD_LIBRARY_UTILS_REPO: https://gitlab.com/kicad/libraries/kicad-library-utils.git
  KICAD_LIBRARY_UTILS_BRANCH: master
  KICAD_LIBRARY_UTILS_DIR: ~/klu

default:
  before_script:
    # Expand ~ properly
    - KICAD_LIBRARY_UTILS_DIR="${KICAD_LIBRARY_UTILS_DIR/#\~/$HOME}"
    - echo "Cloning ${KICAD_LIBRARY_UTILS_REPO} branch ${KICAD_LIBRARY_UTILS_BRANCH}"
    - git clone --depth 1 "${KICAD_LIBRARY_UTILS_REPO}" "$KICAD_LIBRARY_UTILS_DIR" --branch "${KICAD_LIBRARY_UTILS_BRANCH}"
    - git config --global --add safe.directory $(realpath .)

klc-check:
  stage: test
  needs: []
  when: always
  allow_failure:
    exit_codes:
      - 2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.kicad_mod"
        - "fp-lib-table"
  script:
    - set +e
    - $KICAD_LIBRARY_UTILS_DIR/tools/gitlabci/check_footprints.sh
  artifacts:
    reports:
      junit: junit.xml

screenshot:
  image: kicad/kicad:nightly
  stage: screenshot
  allow_failure: true
  when: manual
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.kicad_mod"
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - sudo apt update -qq
    - sudo apt install curl inkscape python3 git -qqy --no-install-recommends
    - mkdir -p $HOME/.config/kicad/10.0/colors
    - git clone --depth 1 "${KICAD_LIBRARY_UTILS_REPO}" "$KICAD_LIBRARY_UTILS_DIR" --branch "${KICAD_LIBRARY_UTILS_BRANCH}"
    - git config --global --add safe.directory $(realpath .)
    - kicad-cli version --format=about
  script:
    - $KICAD_LIBRARY_UTILS_DIR/tools/gitlabci/screenshot_footprints.sh
  artifacts:
    expose_as: 'Screenshots'
    paths:
      - screenshots/

model:
  image: kicad/kicad:nightly
  stage: model
  allow_failure: true
  when: manual
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.kicad_mod"

  before_script:
    - KICAD_LIBRARY_UTILS_DIR="${KICAD_LIBRARY_UTILS_DIR/#\~/$HOME}"
    - export DEBIAN_FRONTEND=noninteractive
    - sudo apt update -qq
    - sudo apt install curl python3 git -qqy --no-install-recommends
    - mkdir -p $HOME/.config/kicad/10.0/colors

    - git clone --depth 1 "${KICAD_LIBRARY_UTILS_REPO}" "$KICAD_LIBRARY_UTILS_DIR" --branch "${KICAD_LIBRARY_UTILS_BRANCH}"
    - git clone --depth 1 https://gitlab.com/kicad/libraries/kicad-packages3D $CI_BUILDS_DIR/kicad-packages3D

    - sed -i 's/fp_wrl[[:space:]]*=[[:space:]]*fp\.Duplicate[[:space:]]*\([[:space:]]*\)/fp_wrl = fp.Duplicate(True)/g' "$KICAD_LIBRARY_UTILS_DIR/ci_patches/create_model_board.py"

    # ✅ VERIFY PATCH (IMPORTANT)
    - echo "VERIFY PATCH:"
    - grep -n "Duplicate" "$KICAD_LIBRARY_UTILS_DIR/scripts/create_model_board.py"

    - git config --global --add safe.directory $(realpath .)
    - kicad-cli version --format=about

  script:
    - $KICAD_LIBRARY_UTILS_DIR/tools/gitlabci/screenshot_model.sh

  artifacts:
    expose_as: 'Model'
    paths:
      - model/
      - model/
      - screenshots/

visual_diff:
  stage: diffs
  needs: []
  tags:
    - saas-linux-medium-amd64
  image: kicad/kicad:nightly
  allow_failure: true
  when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.kicad_mod"
  script:
    - kicad-cli version --format=about
    - echo -e "\e[0Ksection_start:`date +%s`:environment[collapsed=true]\r\e[0KEnvironment"
    - printenv
    - echo -e "\e[0Ksection_end:`date +%s`:environment\r\e[0K"
    - mkdir -p $HOME/.config/kicad/10.0/colors
    - sudo apt update -qq
    - sudo apt install curl python3 python3-pip -qqy --no-install-recommends
    - python3 -V
    - pip install --break-system-packages --no-warn-script-location pygments wsdiff jinja2
    - source $KICAD_LIBRARY_UTILS_DIR/tools/gitlabci/common.sh
    - $KICAD_LIBRARY_UTILS_DIR/tools/gitlabci/visual_diff.sh \
        -r "${CI_PROJECT_DIR}" \
        -b "${BASE_SHA}" \
        -t "${TARGET_SHA}" \
        -o "diffs"
  artifacts:
    expose_as: "Visual Diff"
    paths:
      - "diffs/"
    reports:
      dotenv: deploy.env
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: $DYNAMIC_ENVIRONMENT_URL